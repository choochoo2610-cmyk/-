<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイムカード管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>管理画面</h2>

<h3>人の管理</h3>
<input id="userName" placeholder="名前">
<input id="userWage" placeholder="時給" type="number">
<button onclick="addUser()">追加</button>
<button onclick="editUser()">編集</button>
<button onclick="deleteUser()">削除</button>

<hr>

<h3>勤務入力</h3>
<select id="userSelect"></select><br><br>

<input id="date" type="date">
<input id="start" type="time">
<input id="end" type="time">
<input id="breakTime" type="number" placeholder="休憩(分)">
<input id="memo" placeholder="メモ">
<button onclick="addRecord()">追加</button>

<hr>

<h3>表示</h3>
<input id="monthSelect" type="month">

<table border="1">
  <tbody id="records"></tbody>
</table>

<p id="summary"></p>

<hr>

<button onclick="finalizeMonth()">月の更新を確定</button>

<p>閲覧用URL：</p>
<code id="viewUrl"></code>

<!-- ★ここだけ！！ -->
<script src="script.js"></script>

</body>
</html>
